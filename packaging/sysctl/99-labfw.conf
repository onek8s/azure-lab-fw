# labfw kernel parameters (docs/PLAN.md §6.2), applied at boot by
# systemd-sysctl. Mirrors internal/dataplane.Sysctls so the unprivileged
# daemon does not need to write /proc/sys (the deployed config sets
# dataplane.skipSysctl: true). Keep both lists in sync.
net.ipv4.ip_forward = 1
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.eth0.send_redirects = 0
net.ipv4.conf.all.rp_filter = 2
net.ipv6.conf.all.forwarding = 0
# nf_conntrack is loaded early by /etc/modules-load.d/labfw.conf
# (packaging/modules-load) so these keys exist when systemd-sysctl runs.
# nf_conntrack_max must match dataplane.conntrackMax.
net.netfilter.nf_conntrack_max = 32768
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
# B1ls memory safety net (§8.3, §12): swap only under real pressure.
vm.swappiness = 10
