# Load conntrack before systemd-sysctl so the net.netfilter.* keys in
# /etc/sysctl.d/99-labfw.conf can be applied at boot (labfw).
nf_conntrack
# WireGuard for the optional site-to-client VPN (vpn.enabled, PLAN §6.8).
# The unprivileged daemon creates wg0 over rtnetlink; the kernel would also
# autoload the module on that request, loading it at boot makes it explicit.
wireguard
