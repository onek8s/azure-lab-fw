name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          # config verify downloads the JSON schema; skip it so a slow
          # golangci-lint.run does not fail CI (the config is linted locally).
          verify: false
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: view-logs offline test (fake az)
        run: bash deploy/scripts/view-logs-test.sh
      - name: vpn-peer offline test (fake az)
        run: bash deploy/scripts/vpn-peer-test.sh
      - name: privileged tests (nft -c, netns)
        run: |
          sudo apt-get install -y -qq nftables conntrack >/dev/null
          sudo -E env "PATH=$PATH" go test -count=1 ./internal/...
  netns:
    # Acceptance matrix A1–A28, A30 (WireGuard VPN) + randomized
    # differential test in network namespaces (PLAN §9.2, test/netns).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install nftables, conntrack, iproute2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables conntrack iproute2 >/dev/null
      - name: sudo make test-netns
        run: sudo -E env "PATH=$PATH" NETNS_ARTIFACT_DIR="$RUNNER_TEMP/netns-artifacts" make test-netns
      - if: failure()
        name: make logs readable
        # Written by root (sudo make); the upload action runs as the runner user.
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/netns-artifacts" || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: netns-daemon-logs
          path: ${{ runner.temp }}/netns-artifacts
          retention-days: 7
  budget:
    # Resource budget for Standard_B1ls (PLAN §12.4, acceptance A29): load
    # test with the daemon in a systemd scope (MemoryMax=512M,
    # CPUQuota=100%). Fails if idle RSS >= 40 MiB or peak RSS >= 100 MiB.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install nftables, conntrack, iproute2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables conntrack iproute2 >/dev/null
      - name: sudo make bench-b1ls
        run: sudo -E env "PATH=$PATH" NETNS_LOAD_SECONDS=30 NETNS_ARTIFACT_DIR="$RUNNER_TEMP/budget-artifacts" make bench-b1ls
      - if: always()
        name: job summary
        run: cat "$RUNNER_TEMP/budget-artifacts/a29-summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        name: make artifacts readable
        # Written by root (sudo make); the upload action runs as the runner user.
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/budget-artifacts" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-a29
          path: ${{ runner.temp }}/budget-artifacts
          retention-days: 14
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-all
      - uses: actions/upload-artifact@v4
        with:
          name: labfw-binaries
          path: bin/
          retention-days: 7
  deploy-artifacts:
    # Offline validation only: no Azure login, no deployment.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bicep build
        run: |
          az bicep install
          az bicep version
          az bicep build --file deploy/bicep/main.bicep --stdout >/dev/null
          az bicep build-params --file deploy/bicep/main.bicepparam --stdout >/dev/null
          # readEnvironmentVariable() defaults keep this buildable offline;
          # also build with the optional test VM enabled.
          az bicep build-params --file deploy/bicep/lab-existing-hub.bicepparam --stdout >/dev/null
          LABFW_TEST_VM=true az bicep build-params --file deploy/bicep/lab-existing-hub.bicepparam --stdout >/dev/null
          LABFW_VPN_ENABLED=true LABFW_VPN_PEERS='[{"name":"agent-1","publicKey":"xTIBA5rboUvnH4htodjb6e697QjLERt1NAB4mZqp8Dg=","allowedIPs":["10.0.12.10/32"]}]' \
            az bicep build-params --file deploy/bicep/lab-existing-hub.bicepparam --stdout >/dev/null
          az bicep lint --file deploy/bicep/main.bicep
          az bicep lint --file deploy/bicep/lab-existing-hub.bicepparam
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files 'deploy/*.sh' 'scripts/*.sh')
          shellcheck "${scripts[@]}"
      - name: cloud-init template
        run: |
          python3 - <<'EOF'
          import base64, yaml
          s = open("deploy/cloud-init/cloud-init.yaml").read()
          for k in ("__CONFIG_YAML__", "__INSTALL_SH__"):
              assert k in s, k
              s = s.replace(k, base64.b64encode(b"x").decode())
          for k, v in {"__LABFW_VERSION__": "v0.0.0", "__ARCH__": "amd64", "__RELEASE_REPO__": "o/r"}.items():
              assert k in s, k
              s = s.replace(k, v)
          assert "__" not in s, "unreplaced placeholder"
          d = yaml.safe_load(s)
          assert s.startswith("#cloud-config") and d["runcmd"], d
          EOF
      - name: systemd unit
        run: |
          # The binary is not installed here; every other finding fails the job.
          out="$(systemd-analyze verify --man=no packaging/systemd/labfw.service 2>&1 | grep -v 'is not executable' || true)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
