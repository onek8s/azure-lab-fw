name: azure-quota
# Requests a regional vCPU quota for a VM family (Microsoft.Quota API) so the
# lab can use small B-series sizes. Quota requests are free; small B-series
# limits are usually auto-approved within minutes. Uses AZURE_OWNER because
# the lab's OIDC identity is only Reader at subscription scope.
on:
  workflow_dispatch:
    inputs:
      family:
        description: "VM family quota name (e.g. standardBasv2Family = B2ats_v2/B2als_v2)"
        default: standardBasv2Family
      limit:
        description: "New vCPU limit for that family"
        default: "4"
      location:
        default: swedencentral
permissions:
  contents: read
concurrency:
  group: azure-quota
jobs:
  quota:
    runs-on: ubuntu-24.04
    env:
      FAMILY: ${{ inputs.family }}
      LIMIT: ${{ inputs.limit }}
      LOCATION: ${{ inputs.location }}
      SUB: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: check inputs
        run: |
          [[ "$FAMILY" =~ ^[A-Za-z0-9]{3,64}$ ]] || { echo "::error::bad family"; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]{1,3}$ ]] || { echo "::error::bad limit"; exit 1; }
          [[ "$LOCATION" =~ ^[a-z0-9]{3,32}$ ]] || { echo "::error::bad location"; exit 1; }
          [[ "$SUB" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::vars.AZURE_SUBSCRIPTION_ID not set"; exit 1; }
      - name: az login (AZURE_OWNER)
        env:
          AZURE_OWNER: ${{ secrets.AZURE_OWNER }}
        run: |
          test -n "$AZURE_OWNER" || { echo "::error::secret AZURE_OWNER not visible"; exit 1; }
          appId=$(jq -r '.appId // .clientId' <<<"$AZURE_OWNER")
          pw=$(jq -r '.password // .clientSecret' <<<"$AZURE_OWNER")
          tenant=$(jq -r '.tenant // .tenantId' <<<"$AZURE_OWNER")
          echo "::add-mask::$pw"
          az login --service-principal -u "$appId" -p "$pw" --tenant "$tenant" -o none
          az account set -s "$SUB"
      - name: request quota
        run: |
          set -euo pipefail
          az provider register -n Microsoft.Quota --wait -o none
          scope="subscriptions/$SUB/providers/Microsoft.Compute/locations/$LOCATION"
          api=2023-02-01
          echo "current usage:"
          az vm list-usage -l "$LOCATION" --query "[?name.value=='$FAMILY' || name.value=='cores'].{name:name.value,current:currentValue,limit:limit}" -o table
          body="$(jq -nc --arg f "$FAMILY" --argjson l "$LIMIT" '{properties:{limit:{limitObjectType:"LimitValue",value:$l},name:{value:$f}}}')"
          az rest -m put -u "https://management.azure.com/$scope/providers/Microsoft.Quota/quotas/$FAMILY?api-version=$api" \
            --headers Content-Type=application/json -b "$body" -o json >"$RUNNER_TEMP/req.json" || true
          jq -c '{id: .id, state: .properties.provisioningState, message: .properties.message}' "$RUNNER_TEMP/req.json" 2>/dev/null || cat "$RUNNER_TEMP/req.json"
          # Poll the quota until it reflects the new limit (auto-approval) or give up.
          for i in $(seq 1 40); do
            cur="$(az rest -m get -u "https://management.azure.com/$scope/providers/Microsoft.Quota/quotas/$FAMILY?api-version=$api" --query properties.limit.value -o tsv 2>/dev/null || echo 0)"
            echo "attempt $i: $FAMILY limit=$cur"
            if [ "${cur:-0}" -ge "$LIMIT" ]; then
              echo "### $FAMILY quota in $LOCATION is now $cur vCPUs" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          reqs="$(az rest -m get -u "https://management.azure.com/$scope/providers/Microsoft.Quota/quotaRequests?api-version=$api" \
            --query "value[0:3].{state:properties.provisioningState,message:properties.message}" -o json 2>/dev/null || echo '[]')"
          echo "latest requests: $reqs"
          { echo "### $FAMILY quota request not approved yet"; echo '```'; echo "$reqs"; echo '```'
            echo "It may need manual approval (support ticket) — check Azure portal > Quotas."; } >>"$GITHUB_STEP_SUMMARY"
          exit 1
