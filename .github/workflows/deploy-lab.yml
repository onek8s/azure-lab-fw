name: deploy-lab
# Deploys deploy/bicep/main.bicep into an existing resource group and smoke
# tests labfw via Run Command. Authentication is OIDC only (no secrets); the
# identity, federated credential and repository variables are set up by the
# bootstrap (README "Deploy to Azure"):
#   vars.AZURE_CLIENT_ID, vars.AZURE_TENANT_ID, vars.AZURE_SUBSCRIPTION_ID
#   vars.LABFW_RG, vars.LABFW_LOCATION, vars.LABFW_POLICY_ID,
#   vars.LABFW_UAMI_ID, vars.LABFW_UAMI_CLIENT_ID
#
# mode=existing-hub uses deploy/bicep/lab-existing-hub.bicepparam: only
# snet-labfw is added to the existing hub VNet, spokes are NOT changed (run
# wire-spokes.yml for that). mode=isolated creates its own hub (+ test spoke).
on:
  workflow_dispatch:
    inputs:
      labfwVersion:
        description: "labfw release tag to install (e.g. v0.1.0)"
        required: true
        type: string
      mode:
        description: "existing-hub = add snet-labfw to the existing hub (lab-existing-hub.bicepparam); isolated = own hub VNet"
        type: choice
        options:
          - existing-hub
          - isolated
        default: existing-hub
      vmSize:
        description: "Firewall/test VM size (x64), or 'auto' = cheapest size with capacity and quota in the region"
        type: string
        default: auto
      testVm:
        description: "existing-hub: deploy a small test VM (no public IP) in snet-clients"
        type: boolean
        default: false
      deployTestSpoke:
        description: "isolated: deploy the peered test spoke and test VM"
        type: boolean
        default: true
      deploySamplePolicy:
        description: "Deploy and use the sample Standard policy instead of vars.LABFW_POLICY_ID"
        type: boolean
        default: false
permissions:
  id-token: write
  contents: read
concurrency:
  group: azure-lab
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: azure-lab
    env:
      RG: ${{ vars.LABFW_RG }}
      LOCATION: ${{ vars.LABFW_LOCATION }}
      POLICY_ID: ${{ vars.LABFW_POLICY_ID }}
      UAMI_ID: ${{ vars.LABFW_UAMI_ID }}
      UAMI_CLIENT_ID: ${{ vars.LABFW_UAMI_CLIENT_ID }}
      LABFW_VERSION: ${{ inputs.labfwVersion }}
      VM_SIZE: ${{ inputs.vmSize }}
      MODE: ${{ inputs.mode }}
      TEST_VM: ${{ inputs.testVm }}
      DEPLOY_TEST_SPOKE: ${{ inputs.deployTestSpoke }}
      DEPLOY_SAMPLE_POLICY: ${{ inputs.deploySamplePolicy }}
    steps:
      - uses: actions/checkout@v4
      - name: check inputs
        run: |
          set -euo pipefail
          for v in RG LOCATION UAMI_ID UAMI_CLIENT_ID; do
            if [ -z "${!v}" ]; then echo "::error::repository variable for $v is not set"; exit 1; fi
          done
          if [ "$DEPLOY_SAMPLE_POLICY" != "true" ] && [ -z "$POLICY_ID" ]; then
            echo "::error::vars.LABFW_POLICY_ID is required unless deploySamplePolicy is true"; exit 1
          fi
          if ! [[ "$LABFW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::labfwVersion must look like v0.1.0"; exit 1
          fi
          case "$MODE" in
            existing-hub | isolated) ;;
            *) echo "::error::mode must be existing-hub or isolated"; exit 1 ;;
          esac
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: pick VM size
        if: ${{ inputs.vmSize == 'auto' }}
        run: |
          set -euo pipefail
          count=1
          if [ "$MODE" = "existing-hub" ] && [ "$TEST_VM" = "true" ]; then count=2; fi
          if [ "$MODE" = "isolated" ] && [ "$DEPLOY_TEST_SPOKE" = "true" ]; then count=2; fi
          size="$(LOCATION="$LOCATION" COUNT="$count" bash deploy/scripts/pick-vm-size.sh)"
          echo "VM_SIZE=$size" >>"$GITHUB_ENV"
          echo "VM size: \`$size\` (auto)" >>"$GITHUB_STEP_SUMMARY"
      - name: deploy
        id: deploy
        run: |
          set -euo pipefail
          # Throwaway key: the VMs are managed through Run Command, not SSH.
          # Azure rejects changing ssh.publicKeys on an existing VM, so a
          # re-deploy reuses the key already on the firewall VM.
          existing_key="$(az vm list -g "$RG" --query "[?tags.managedBy=='labfw-deploy'] | [0].osProfile.linuxConfiguration.ssh.publicKeys[0].keyData" -o tsv 2>/dev/null || true)"
          if [ -n "$existing_key" ]; then
            printf '%s\n' "$existing_key" >"$RUNNER_TEMP/labfw_key.pub"
            : >"$RUNNER_TEMP/labfw_key"
            echo "Re-deploy: reusing the SSH public key of the existing VM."
          else
            ssh-keygen -q -t ed25519 -N '' -C labfw-deploy -f "$RUNNER_TEMP/labfw_key"
          fi
          az bicep install
          name="labfw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "$MODE" = "existing-hub" ]; then
            # lab-existing-hub.bicepparam reads these with readEnvironmentVariable().
            LABFW_SSH_PUBLIC_KEY="$(cat "$RUNNER_TEMP/labfw_key.pub")"
            export LABFW_SSH_PUBLIC_KEY LABFW_VERSION
            export LABFW_POLICY_ID="$POLICY_ID"
            export LABFW_UAMI_ID="$UAMI_ID"
            export LABFW_UAMI_CLIENT_ID="$UAMI_CLIENT_ID"
            export LABFW_TEST_VM="$TEST_VM"
            export LABFW_VM_SIZE="$VM_SIZE" LABFW_TEST_VM_SIZE="$VM_SIZE"
            export LABFW_DEPLOY_SAMPLE_POLICY="$DEPLOY_SAMPLE_POLICY"
            export LABFW_RELEASE_REPO="$GITHUB_REPOSITORY"
            az deployment group create \
              --name "$name" \
              --resource-group "$RG" \
              --parameters deploy/bicep/lab-existing-hub.bicepparam \
              --query properties.outputs -o json >"$RUNNER_TEMP/outputs.json"
          else
            az deployment group create \
              --name "$name" \
              --resource-group "$RG" \
              --template-file deploy/bicep/main.bicep \
              --parameters \
                location="$LOCATION" \
                vmSize="$VM_SIZE" \
                adminSshPublicKey="$(cat "$RUNNER_TEMP/labfw_key.pub")" \
                firewallPolicyId="$POLICY_ID" \
                deploySamplePolicy="$DEPLOY_SAMPLE_POLICY" \
                deployTestSpoke="$DEPLOY_TEST_SPOKE" \
                userAssignedIdentityId="$UAMI_ID" \
                userAssignedIdentityClientId="$UAMI_CLIENT_ID" \
                labfwVersion="$LABFW_VERSION" \
                labfwReleaseRepo="$GITHUB_REPOSITORY" \
              --query properties.outputs -o json >"$RUNNER_TEMP/outputs.json"
          fi
          rm -f "$RUNNER_TEMP/labfw_key" "$RUNNER_TEMP/labfw_key.pub"
          jq . "$RUNNER_TEMP/outputs.json"
          echo "vm=$(jq -r .vmName.value "$RUNNER_TEMP/outputs.json")" >>"$GITHUB_OUTPUT"
      - name: smoke test
        id: smoke
        env:
          VM: ${{ steps.deploy.outputs.vm }}
        run: |
          set -euo pipefail
          # Expanded on the VM, not here.
          # shellcheck disable=SC2016
          # Run Command returns only the last ~4 KiB of stdout, so keep the
          # output short and print the markers last.
          script='cloud-init status --wait >/dev/null 2>&1 || true
          journalctl -u labfw --no-pager -n 8 -o cat 2>/dev/null | cut -c1-300 || true
          echo "LABFW_HEALTH=$(curl -s --max-time 5 127.0.0.1:9090/healthz || echo unreachable)"
          echo "LABFW_VERSION=$(/usr/local/bin/labfw version 2>&1 | head -n1)"
          if journalctl -u labfw --no-pager -n 200 2>/dev/null | grep -q "run: not implemented"; then
            echo "LABFW_RUN=unimplemented"
          fi
          echo "LABFW_STATE=$(systemctl is-active labfw)"'
          az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript \
            --scripts "$script" --query 'value[0].message' -o tsv | tee "$RUNNER_TEMP/smoke.txt"
          # Run Command does not propagate the exit code; check stdout markers.
          if grep -qx 'LABFW_STATE=active' "$RUNNER_TEMP/smoke.txt"; then
            echo "result=passed" >>"$GITHUB_OUTPUT"
          elif grep -q '^LABFW_VERSION=labfw ' "$RUNNER_TEMP/smoke.txt" &&
               grep -qx 'LABFW_RUN=unimplemented' "$RUNNER_TEMP/smoke.txt"; then
            # The binary is installed but this release predates the daemon
            # (`labfw run` returns "not implemented"): expected, not fatal.
            echo "result=skipped (labfw run not implemented in $LABFW_VERSION; binary installed)" >>"$GITHUB_OUTPUT"
            echo "::warning::labfw $LABFW_VERSION is installed on $VM but 'labfw run' is not implemented yet; the service cannot be active. Do not wire spokes until a release with the daemon is deployed."
          else
            echo "result=failed" >>"$GITHUB_OUTPUT"
            echo "::error::labfw is not active on $VM"
            exit 1
          fi
      - name: summary
        if: always()
        env:
          SMOKE: ${{ steps.smoke.outputs.result || 'not run' }}
        run: |
          {
            echo "### labfw lab deployment ($MODE)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Resource group | \`$RG\` |"
            echo "| labfw version | \`$LABFW_VERSION\` |"
            if [ -s "$RUNNER_TEMP/outputs.json" ]; then
              jq -r 'to_entries[] | "| \(.key) | `\(.value.value)` |"' "$RUNNER_TEMP/outputs.json"
            fi
            echo "| Smoke test | $SMOKE |"
            if [ "$MODE" = "existing-hub" ]; then
              echo
              echo "Spokes are not routed through labfw yet: run **wire-spokes** (target=client, action=apply, confirm=wire) once the smoke test passes."
            fi
            if [ -s "$RUNNER_TEMP/smoke.txt" ]; then
              echo
              echo '<details><summary>Run Command output</summary>'
              echo
              echo '```'
              cat "$RUNNER_TEMP/smoke.txt"
              echo '```'
              echo '</details>'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
